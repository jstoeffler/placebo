version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # typescript-eslint supports TypeScript < 6.1; bump together with it, by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
